# Иностранные слова в сведениях для потребителя — словарь проверки F4.
#
# Норма: ст. 10.1 ЗОЗПП, введена ФЗ от 24.06.2025 № 168-ФЗ, действует с 01.03.2026.
# Сведения для потребителя даются на русском языке. Из-под требования выведены
# фирменные наименования, товарные знаки и знаки обслуживания (п. 3 ст. 3 53-ФЗ
# «О государственном языке»).
#
# Сверено 10.09.2026 по garant.ru (разбор ст. 10.1) и карточке закона на
# government.ru. САНКЦИЯ НЕ ВЫВЕРЕНА: вторичные источники называют ст. 14.5 и
# 14.8 КоАП, первоисточник не смотрели — поэтому F4 намеренно не заведён в
# секцию map: в fines.yaml и в сумму риска не попадает. Не добавлять до сверки.
#
# Берём только слова с однозначным русским аналогом. Заимствования, где
# «общеупотребительный аналог» спорный (блог, портфолио, кешбэк, коворкинг,
# шоурум), не берём: порог субъективный, а ложное обвинение в отчёте стоит
# дороже пропущенного слова. По той же причине не ищем латиницу сплошняком —
# домен, почта и Wi-Fi есть почти на каждом сайте.

# Слой 1 — навигация, кнопки, заголовки страниц. Обращены к покупателю напрямую.
interface:
  sale: распродажа
  sales: распродажа
  discount: скидка
  discounts: скидки
  new: новинки
  shop: магазин
  store: магазин
  buy: купить
  order: заказать
  cart: корзина
  basket: корзина
  checkout: оформление заказа
  price: цена
  prices: цены
  delivery: доставка
  shipping: доставка
  payment: оплата
  returns: возврат
  refund: возврат
  catalog: каталог
  catalogue: каталог
  services: услуги
  contacts: контакты
  about: о компании
  home: главная
  menu: меню
  search: поиск
  login: вход
  logout: выход
  news: новости
  reviews: отзывы
  gift: подарок
  free: бесплатно
  more: подробнее
  send: отправить
  subscribe: подписаться
  download: скачать

# Слой 2 — подписи и подсказки полей формы. Тоже сведения для потребителя, но
# претензия здесь слабее: поле подписано, смысл читается из контекста формы.
form_fields:
  name: имя
  email: электронная почта
  e-mail: электронная почта
  phone: телефон
  message: сообщение
  comment: комментарий
  address: адрес
  city: город
  company: компания
  subject: тема
