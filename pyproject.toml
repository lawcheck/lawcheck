[project]
name = "lawcheck"
version = "0.1.0"
description = "Сервис проверки сайтов на соответствие 152-ФЗ и смежному законодательству РФ"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # ВАЖНО: версия должна совпадать с тегом базового образа в Dockerfile
    # (mcr.microsoft.com/playwright/python:vX.Y.Z-noble). Без пина pip тянет
    # свежий playwright, а браузеры в образе остаются старыми → chromium.launch
    # падает «Executable doesn't exist». Обновлять пару образ+пин синхронно.
    "playwright==1.60.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "redis>=5.2",
    "rq>=2.0",
    "pyyaml>=6.0",
    "python-whois>=0.9",
    "tldextract>=5.1",
    "dnspython>=2.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "pypdf>=5.0",
    "markdown>=3.7",
    "passlib[argon2]>=1.7",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # ВАЖНО: точная версия, а не диапазон. Набор правил по умолчанию у ruff
    # меняется между минорными релизами: на 0.16 тот же код даёт 87 замечаний,
    # которых нет на 0.15. С открытым диапазоном линтер в CI зависит от даты
    # запуска, а не от кода — прогон краснеет сам по себе. Обновлять осознанно,
    # отдельным PR, вместе с разбором новых правил.
    "ruff==0.15.13",
    # Стабы для mypy: без них прогон краснеет на чужих библиотеках, а не на
    # нашем коде — и настоящую ошибку в этом шуме не видно.
    "types-PyYAML",
    "types-Markdown",
    "types-passlib",
    "mypy>=1.13",
]

# Пакет один — lawcheck. Без явного указания setuptools пытается угадать и
# спотыкается о каталог `alembic` рядом: «Multiple top-level packages discovered
# in a flat-layout». Миграции — не библиотека, в дистрибутив им не надо.
[tool.setuptools.packages.find]
include = ["lawcheck*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
files = ["lawcheck"]
# Не strict: аннотации в проекте местами отсутствуют, и включать всё сразу
# означало бы получить сотни замечаний и выключить прогон обратно. Задача
# скромнее — держать прогон зелёным, чтобы новая настоящая ошибка была видна.
warn_unused_ignores = true
warn_redundant_casts = true
