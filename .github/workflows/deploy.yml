# CI/CD: проверки на каждый pull request + деплой на прод (VPS Timeweb) при push
# в main.
#
# Проверки СПЕЦИАЛЬНО стоят и на pull_request: раньше workflow триггерился только
# на push в main, поэтому тесты шли уже после мержа. Сломанный тест ронял не мерж,
# а деплой — то есть код к тому моменту уже лежал в main. Порядок был обратный
# нужному.
#
# Повторяет ручную процедуру из handoff/TASKS.md §3: rsync кода на сервер,
# затем docker compose build api worker && up -d (шаблоны/код вшиты в образ
# при build — просто restart недостаточно).
#
# Что CI НЕ делает (остаётся ручным, как и раньше):
#   - docker compose restart caddy после правки Caddyfile;
#   - ALTER TABLE ... ADD COLUMN на прод-Postgres (create_all не добавляет
#     колонки в существующие таблицы).
#
# Секрет: DEPLOY_SSH_KEY — приватный ed25519-ключ, парный публичный лежит
# в /root/.ssh/authorized_keys на сервере (отдельный ключ только для CI,
# отзывается удалением строки github-actions-deploy@lawcheck).

name: CI / Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Проверки PR: новый пуш отменяет предыдущий прогон, ждать его незачем.
  # Деплой на прод: очередь без отмены, иначе выкат можно оборвать на середине.
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('pr-{0}', github.head_ref)
        || 'deploy-prod' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEPLOY_HOST: 5.129.200.118
  # Выкат идёт под непривилегированным пользователем deploy (группа docker),
  # код живёт в /home/deploy/lawcheck. Приватный ключ DEPLOY_SSH_KEY на
  # сервере ограничен force-command через /usr/local/bin/lawcheck-deploy-shell:
  # ключ умеет ТОЛЬКО rsync в каталог деплоя и фиксированный набор команд
  # `docker compose -f /home/deploy/lawcheck/docker-compose.yml …`.
  # Компрометация Actions больше не даёт шелл на проде.
  # Команды ниже должны дословно совпадать с белым списком обёртки.
  DEPLOY_USER: deploy
  DEPLOY_PATH: /home/deploy/lawcheck

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Установка зависимостей
        run: pip install -e ".[dev]"
      - name: Линтер
        run: ruff check lawcheck tests
      - name: Типы
        run: mypy
      - name: Тесты
        # METRIKA_ID пуст специально: настройки на раннере не должны отличаться
        # от чистой машины, иначе тест снова начнёт зависеть от чужого .env.
        env:
          METRIKA_ID: ""
        run: pytest -q

  deploy:
    needs: test
    # Выкатываем ТОЛЬКО main, и условие смотрит на ветку, а не на событие.
    # Через `event_name != 'pull_request'` джоб запускался и на
    # workflow_dispatch с любой ветки — то есть ручной прогон на фиче
    # выкатывал эту фичу на прод. На pull_request ref имеет вид
    # refs/pull/N/merge и под условие не подходит, так что PR по-прежнему
    # только проверяются.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: SSH-ключ и пиннинг host key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # host key прод-сервера, сверен с доверенным known_hosts владельца
          echo "${DEPLOY_HOST} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJLmx+owImbyBf++4GFDTJYb6FE0Py6HT7NFgPspMxKu" >> ~/.ssh/known_hosts

      - name: Синхронизация кода на сервер
        run: |
          rsync -az \
            --exclude '__pycache__/' --exclude '.git/' --exclude '.venv/' \
            --exclude '*.db' --exclude '.env' \
            lawcheck alembic alembic.ini pyproject.toml Dockerfile Caddyfile docker-compose.yml \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      # Сервисы НЕ перечисляем поимённо: со списком новый сервис в compose
      # молча не доезжает на прод — его приходится поднимать руками, и об этом
      # узнаёшь, когда он не работает. `up -d` без аргументов трогает только те
      # контейнеры, у которых изменилась конфигурация или образ.
      - name: Сборка и перезапуск сервисов
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "docker compose -f ${DEPLOY_PATH}/docker-compose.yml build"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "docker compose -f ${DEPLOY_PATH}/docker-compose.yml up -d --remove-orphans"

      # Caddyfile смонтирован bind-mount'ом, rsync меняет иноду — работающий
      # контейнер продолжает держать старый файл. Перезапуск подхватывает новый.
      - name: Рестарт Caddy (bind-mount не видит новую иноду Caddyfile)
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "docker compose -f ${DEPLOY_PATH}/docker-compose.yml restart caddy"

      - name: Проверка живости
        run: |
          sleep 5
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 https://lawchek.ru/healthz; then exit 0; fi
            sleep 5
          done
          echo "healthz не ответил после деплоя" >&2
          exit 1
