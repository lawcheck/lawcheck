services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lawcheck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lawcheck}
      POSTGRES_DB: lawcheck
    # Порт наружу НЕ публикуем — доступ только внутри compose-сети.
    networks: [data_api, data_job]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawcheck"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Порт наружу НЕ публикуем — доступ только внутри compose-сети.
    networks: [data_api, data_job]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    # .env хоста пробрасывается в контейнер целиком (METRIKA_ID, TOCHKA_* и т.д.):
    # сам файл в образ не копируется, pydantic-settings читает переменные окружения.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://lawcheck:${POSTGRES_PASSWORD:-lawcheck}@postgres:5432/lawcheck
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Наружу не публикуем — Caddy проксирует внутри сети по имени api:8000.
    expose:
      - "8000"
    networks: [edge, data_api]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    command: ["uvicorn", "lawcheck.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # Единственный контейнер, который открывает НЕДОВЕРЕННЫЕ страницы: адрес
  # называет произвольный посетитель, Chromium его рендерит. Поэтому здесь
  # урезано всё, что можно урезать.
  worker:
    build: .
    restart: unless-stopped
    # env_file: .env НЕТ намеренно. Воркеру не нужны ни ключ эквайринга, ни
    # пароль почты, ни секрет подписи сессий, ни ключ внутренних ручек — а при
    # сквозном пробросе .env они лежали здесь же, рядом с браузером, который
    # ходит по чужим сайтам. Перечисляем ровно то, чем воркер пользуется.
    environment:
      DATABASE_URL: postgresql+psycopg://lawcheck:${POSTGRES_PASSWORD:-lawcheck}@postgres:5432/lawcheck
      REDIS_URL: redis://redis:6379/0
      # Диффы мониторинга клиентам (notify/monitoring.py) и ссылка на отчёт в них.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      SITE_BASE_URL: ${SITE_BASE_URL:-https://lawchek.ru}
      CRAWLER_MAX_PAGES: ${CRAWLER_MAX_PAGES:-30}
      CRAWLER_TIMEOUT_SEC: ${CRAWLER_TIMEOUT_SEC:-30}
      CRAWLER_USER_AGENT: ${CRAWLER_USER_AGENT:-LawCheckBot/0.1 (+https://lawchek.ru/bot)}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Сеть без `api`: даже если из браузера удастся дотянуться до внутреннего
    # адреса, ходить будет некуда — `api:8000/inbox` из этой сети не резолвится.
    networks: [data_job]
    cap_drop: [ALL]
    # no-new-privileges здесь НЕ ставим намеренно. Chromium, если недоступна
    # песочница на user namespaces, откатывается на setuid-хелпер, а этот флаг
    # ровно такой запуск и запрещает. Сломать песочницу браузера ради флага —
    # размен в минус: она и есть главная граница вокруг чужого JS.
    # Одна страница с бесконечным циклом не должна класть весь хост.
    mem_limit: 2g
    cpus: 1.5
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "lawcheck"]

  # Письма-догонялки лидам (scan_submit → оплата). Раз в сутки в 09:00 МСК
  # (06 UTC) — утро читается лучше ночи. Повтор безвреден: отправленным
  # проставлен `Lead.mailed_at`, и в выборку они больше не попадают, а если
  # письмо не ушло — метка не ставится и лид достанется следующему прогону.
  # Кому и что шлём — reporting/followup.py, docs/followup-email-kit.md.
  followups:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://lawcheck:${POSTGRES_PASSWORD:-lawcheck}@postgres:5432/lawcheck
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data_job]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          if [ "$$(date -u +%H)" = "06" ]; then
            python -m lawcheck.tools.send_followups --limit 20 || true
            python -m lawcheck.tools.send_order_reminders --limit 20 || true
          fi
          # Спим до верха следующего часа, а не ровно 3600: фиксированный sleep
          # накапливает сдвиг на время прогона и однажды перескочит час 06.
          sleep $$(( 3600 - $$(date -u +%s) % 3600 ))
        done

  # Входящие на служебный ящик → алерт владельцу в Telegram: ответы лидов на
  # письма-догонялки и отбойники почтовика. Раз в 5 минут — здесь гейт по часу
  # не нужен, письмо ждать сутки нельзя. Дубли отсекает флаг \Seen самого IMAP,
  # см. notify/inbox.py. БД не трогает, поэтому depends_on пустой.
  inbox:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    networks: [data_job]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          python -m lawcheck.tools.poll_inbox --limit 20 || true
          sleep 300
        done

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Логин и пароль basic auth для /stats и /inbox. Файл лежит ТОЛЬКО на
      # сервере и в git не попадает (см. .gitignore и caddy-auth.conf.example):
      # хеш в репозитории означает, что пароль нельзя сменить, не сделав коммит,
      # поэтому его и не меняли. ВАЖНО: файл должен существовать до `up`,
      # иначе Docker создаст на его месте каталог и Caddy не стартует.
      - ./caddy-auth.conf:/etc/caddy/auth.conf:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
      - goaccess_report:/srv/goaccess:ro
    networks: [edge]
    cap_drop: [ALL]
    # Только право слушать 80/443 — всё остальное Caddy не нужно.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    depends_on:
      - api

  # Серверная аналитика: раз в 10 минут перечитывает access-лог Caddy и
  # обновляет HTML-отчёт. Без JS на страницах и без cookie — политика ПДн
  # сервиса не затрагивается. Отчёт: https://lawchek.ru/stats (basic auth).
  goaccess:
    image: allinurl/goaccess
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          goaccess /srv/logs/access.log --log-format=CADDY \
            -o /srv/report/index.html --no-query-string || true
          sleep 600
        done
    volumes:
      - caddy_logs:/srv/logs:ro
      - goaccess_report:/srv/report
    # Сеть не нужна вообще: читает файл лога, пишет HTML в том.
    network_mode: none
    security_opt: [no-new-privileges:true]
    mem_limit: 512m

# Сети разведены так, чтобы у `worker` и `api` не было общей: воркер рендерит
# страницы, которые назвал посторонний, и внутренняя сеть с веб-приложением
# рядом с таким браузером — лишний приз за SSRF. Postgres и redis стоят в обеих,
# они и есть точка встречи (очередь RQ + общие данные).
networks:
  edge:      # caddy ↔ api
  data_api:  # api ↔ postgres, redis
  data_job:  # worker, followups, inbox ↔ postgres, redis

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  caddy_logs:
  goaccess_report:
